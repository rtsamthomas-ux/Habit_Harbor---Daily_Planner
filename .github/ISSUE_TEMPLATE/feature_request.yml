name: Feature request
description: Suggest a useful improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need or problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good solution look like?
    validations:
      required: true
